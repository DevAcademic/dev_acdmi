<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlix - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
        }

        .auth-header h1 {
            font-size: 36px;
            color: #E50914;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #0a0a0a;
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #E50914;
            color: white;
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
        }

        .input-group .toggle-password {
            right: auto;
            left: 15px;
            cursor: pointer;
            z-index: 2;
        }

        .auth-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: #E50914;
            outline: none;
        }

        .auth-input::placeholder {
            color: #555;
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 20px;
        }

        .checkbox {
            color: #888;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #E50914;
        }

        .forgot-link {
            color: #E50914;
            font-size: 13px;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #E50914;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-btn:hover {
            background: #f6121e;
            transform: scale(1.02);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .auth-link a {
            color: #E50914;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #E50914;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(229, 9, 20, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(229, 9, 20, 0.2);
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #4CAF50;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(76, 175, 80, 0.2);
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px;
            }
            
            .auth-header h1 {
                font-size: 28px;
            }
            
            .auth-input {
                padding: 12px 40px 12px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon">🎬</span>
                <h1>DevFlix</h1>
                <p>منصة المشاهدة الذكية</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <!-- رسائل الخطأ والنجاح -->
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- نموذج تسجيل الدخول -->
            <div id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة المرور" class="auth-input">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                </div>
                <div class="auth-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe"> تذكرني
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>
                <button onclick="handleLogin()" class="auth-btn" id="loginBtn">
                    <i class="fas fa-arrow-left"></i> دخول
                </button>
            </div>

            <!-- نموذج التسجيل -->
            <div id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="registerName" placeholder="الاسم الكامل" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="البريد الإلكتروني" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="كلمة المرور" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="registerConfirm" placeholder="تأكيد كلمة المرور" class="auth-input">
                </div>
                <button onclick="handleRegister()" class="auth-btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i> إنشاء حساب
                </button>
                <p class="auth-link">لديك حساب؟ <a href="#" onclick="switchTab('login')">سجل دخول</a></p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // إعداد Supabase
        // ============================================================
        const supabaseUrl = 'https://hdtrnfpwyvaeziaiweck.supabase.co'
        const supabaseKey = 'sb_publishable_XYiUfizde8-Z0yBjvZNsBw_q_LSXK7V'
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

        // ============================================================
        // دوال مساعدة
        // ============================================================
        function showError(message) {
            const el = document.getElementById('errorMessage')
            el.textContent = message
            el.classList.add('show')
            setTimeout(() => el.classList.remove('show'), 5000)
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage')
            el.textContent = message
            el.classList.add('show')
            setTimeout(() => el.classList.remove('show'), 5000)
        }

        function togglePassword(id) {
            const input = document.getElementById(id)
            const icon = input.nextElementSibling
            if (input.type === 'password') {
                input.type = 'text'
                icon.classList.remove('fa-eye')
                icon.classList.add('fa-eye-slash')
            } else {
                input.type = 'password'
                icon.classList.remove('fa-eye-slash')
                icon.classList.add('fa-eye')
            }
        }

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn')
            const forms = document.querySelectorAll('.auth-form')
            
            tabs.forEach(t => t.classList.remove('active'))
            forms.forEach(f => f.classList.remove('active'))
            
            // إخفاء الرسائل
            document.getElementById('errorMessage').classList.remove('show')
            document.getElementById('successMessage').classList.remove('show')
            
            if (tab === 'login') {
                tabs[0].classList.add('active')
                document.getElementById('loginForm').classList.add('active')
            } else {
                tabs[1].classList.add('active')
                document.getElementById('registerForm').classList.add('active')
            }
        }

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginForm = document.getElementById('loginForm')
                const registerForm = document.getElementById('registerForm')
                if (loginForm.classList.contains('active')) {
                    handleLogin()
                } else if (registerForm.classList.contains('active')) {
                    handleRegister()
                }
            }
        })

        // ============================================================
        // وظيفة تسجيل الدخول
        // ============================================================
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim()
            const password = document.getElementById('loginPassword').value
            const btn = document.getElementById('loginBtn')
            const remember = document.getElementById('rememberMe').checked

            if (!email || !password) {
                showError('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور')
                return
            }

            btn.disabled = true
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...'

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                })

                if (error) {
                    showError('❌ ' + error.message)
                    btn.disabled = false
                    btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول'
                    return
                }

                // حفظ الجلسة
                if (remember) {
                    localStorage.setItem('devflix_session', JSON.stringify(data.session))
                }

                // حفظ معلومات المستخدم
                localStorage.setItem('devflix_user', JSON.stringify(data.user))

                showSuccess('✅ تم تسجيل الدخول بنجاح!')

                // الانتقال إلى لوحة التحكم
                setTimeout(() => {
                    window.location.href = 'dashboard.html'
                }, 800)

            } catch (error) {
                showError('❌ حدث خطأ غير متوقع')
                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول'
            }
        }

        // ============================================================
        // وظيفة التسجيل
        // ============================================================
        async function handleRegister() {
            const name = document.getElementById('registerName').value.trim()
            const email = document.getElementById('registerEmail').value.trim()
            const password = document.getElementById('registerPassword').value
            const confirm = document.getElementById('registerConfirm').value
            const btn = document.getElementById('registerBtn')

            if (!name || !email || !password || !confirm) {
                showError('⚠️ يرجى ملء جميع الحقول')
                return
            }

            if (password.length < 6) {
                showError('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل')
                return
            }

            if (password !== confirm) {
                showError('⚠️ كلمة المرور غير متطابقة')
                return
            }

            btn.disabled = true
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التسجيل...'

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            role: 'user'
                        }
                    }
                })

                if (error) {
                    showError('❌ ' + error.message)
                    btn.disabled = false
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'
                    return
                }

                showSuccess('✅ تم التسجيل بنجاح! يمكنك الدخول الآن')

                // تفريغ الحقول
                document.getElementById('registerName').value = ''
                document.getElementById('registerEmail').value = ''
                document.getElementById('registerPassword').value = ''
                document.getElementById('registerConfirm').value = ''

                // التبديل إلى تسجيل الدخول
                setTimeout(() => {
                    switchTab('login')
                    document.getElementById('loginEmail').value = email
                }, 1000)

                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'

            } catch (error) {
                showError('❌ حدث خطأ غير متوقع')
                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'
            }
        }

        // ============================================================
        // التحقق من الجلسة عند التحميل
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // التحقق من وجود جلسة مخزنة
            const session = localStorage.getItem('devflix_session')
            if (session) {
                try {
                    const { data, error } = await supabaseClient.auth.setSession(JSON.parse(session))
                    if (!error && data.user) {
                        // إذا كانت الجلسة صالحة، الانتقال إلى لوحة التحكم
                        window.location.href = 'dashboard.html'
                    }
                } catch (e) {
                    console.log('جلسة منتهية')
                }
            }

            // التحقق من جلسة Supabase الحالية
            const { data: { user } } = await supabaseClient.auth.getUser()
            if (user) {
                window.location.href = 'dashboard.html'
            }
        })
    </script>
</body>
</html>
