<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlix - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
        }

        .auth-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
        }

        .auth-header h1 {
            font-size: 36px;
            color: #E50914;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .auth-header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #0a0a0a;
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #E50914;
            color: white;
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
        }

        .input-group .toggle-password {
            right: auto;
            left: 15px;
            cursor: pointer;
            z-index: 2;
        }

        .auth-input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            background: #0a0a0a;
            border: 2px solid #2a2a2a;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: #E50914;
            outline: none;
        }

        .auth-input::placeholder {
            color: #555;
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 20px;
        }

        .checkbox {
            color: #888;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #E50914;
        }

        .forgot-link {
            color: #E50914;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: #E50914;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-btn:hover {
            background: #f6121e;
            transform: scale(1.02);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .auth-link a {
            color: #E50914;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .message-box {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message-box.show {
            display: flex;
        }

        .message-box.error {
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid rgba(229, 9, 20, 0.3);
            color: #E50914;
        }

        .message-box.success {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4CAF50;
        }

        .message-box.info {
            background: rgba(33, 150, 243, 0.15);
            border: 1px solid rgba(33, 150, 243, 0.3);
            color: #2196F3;
        }

        .message-box i {
            font-size: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px;
            }
            
            .auth-header h1 {
                font-size: 28px;
            }
            
            .auth-input {
                padding: 12px 40px 12px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo-icon">🎬</span>
                <h1>DevFlix</h1>
                <p>منصة المشاهدة الذكية</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <!-- رسائل الحالة -->
            <div id="messageBox" class="message-box">
                <i id="messageIcon"></i>
                <span id="messageText"></span>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="loginForm" class="auth-form active">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" class="auth-input" value="sajadsarmd200@gmail.com">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="كلمة المرور" class="auth-input">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                </div>
                <div class="auth-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe" checked> تذكرني
                    </label>
                    <span class="forgot-link" onclick="showForgotPassword()">نسيت كلمة المرور؟</span>
                </div>
                <button onclick="handleLogin()" class="auth-btn" id="loginBtn">
                    <i class="fas fa-arrow-left"></i> دخول
                </button>
                <p class="auth-link">ليس لديك حساب؟ <a onclick="switchTab('register')">سجل الآن</a></p>
            </div>

            <!-- نموذج التسجيل -->
            <div id="registerForm" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="registerName" placeholder="الاسم الكامل" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="registerEmail" placeholder="البريد الإلكتروني" class="auth-input">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="registerPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" class="auth-input">
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('registerPassword')"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="registerConfirm" placeholder="تأكيد كلمة المرور" class="auth-input">
                </div>
                <button onclick="handleRegister()" class="auth-btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i> إنشاء حساب
                </button>
                <p class="auth-link">لديك حساب؟ <a onclick="switchTab('login')">سجل دخول</a></p>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // إعداد Supabase
        // ============================================================
        const supabaseUrl = 'https://hdtrnfpwyvaeziaiweck.supabase.co'
        const supabaseKey = 'sb_publishable_XYiUfizde8-Z0yBjvZNsBw_q_LSXK7V'
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

        // ============================================================
        // دوال الرسائل
        // ============================================================
        function showMessage(message, type = 'error') {
            const box = document.getElementById('messageBox')
            const icon = document.getElementById('messageIcon')
            const text = document.getElementById('messageText')
            
            box.className = 'message-box show ' + type
            box.classList.add('shake')
            
            const icons = {
                error: 'fa-exclamation-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            }
            
            icon.className = 'fas ' + (icons[type] || icons.error)
            text.textContent = message
            
            setTimeout(() => {
                box.classList.remove('shake')
            }, 500)
            
            clearTimeout(window.messageTimeout)
            window.messageTimeout = setTimeout(() => {
                box.classList.remove('show')
            }, 6000)
        }

        function hideMessage() {
            document.getElementById('messageBox').classList.remove('show')
        }

        // ============================================================
        // دوال مساعدة
        // ============================================================
        function togglePassword(id) {
            const input = document.getElementById(id)
            if (!input) return
            const icon = input.nextElementSibling
            if (input.type === 'password') {
                input.type = 'text'
                icon.classList.remove('fa-eye')
                icon.classList.add('fa-eye-slash')
            } else {
                input.type = 'password'
                icon.classList.remove('fa-eye-slash')
                icon.classList.add('fa-eye')
            }
        }

        function switchTab(tab) {
            hideMessage()
            
            const tabs = document.querySelectorAll('.tab-btn')
            const forms = document.querySelectorAll('.auth-form')
            
            tabs.forEach(t => t.classList.remove('active'))
            forms.forEach(f => f.classList.remove('active'))
            
            if (tab === 'login') {
                tabs[0].classList.add('active')
                document.getElementById('loginForm').classList.add('active')
            } else {
                tabs[1].classList.add('active')
                document.getElementById('registerForm').classList.add('active')
            }
        }

        function showForgotPassword() {
            showMessage('📧 سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'info')
        }

        // ============================================================
        // وظيفة تسجيل الدخول
        // ============================================================
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim()
            const password = document.getElementById('loginPassword').value
            const btn = document.getElementById('loginBtn')
            const remember = document.getElementById('rememberMe').checked

            hideMessage()

            if (!email || !password) {
                showMessage('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور', 'error')
                return
            }

            btn.disabled = true
            btn.innerHTML = '<i class="fas fa-spinner spinner"></i> جاري الدخول...'

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                })

                if (error) {
                    if (error.message.includes('Invalid login credentials')) {
                        showMessage('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error')
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('⚠️ يرجى تأكيد البريد الإلكتروني أولاً', 'error')
                    } else {
                        showMessage('❌ ' + error.message, 'error')
                    }
                    btn.disabled = false
                    btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول'
                    return
                }

                if (remember) {
                    localStorage.setItem('devflix_session', JSON.stringify(data.session))
                }

                localStorage.setItem('devflix_user', JSON.stringify(data.user))

                showMessage('✅ تم تسجيل الدخول بنجاح! جاري التوجيه...', 'success')

                setTimeout(() => {
                    window.location.href = 'dashboard.html'
                }, 800)

            } catch (error) {
                showMessage('❌ حدث خطأ غير متوقع', 'error')
                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-arrow-left"></i> دخول'
            }
        }

        // ============================================================
        // وظيفة التسجيل المحسنة
        // ============================================================
        async function handleRegister() {
            const name = document.getElementById('registerName').value.trim()
            const email = document.getElementById('registerEmail').value.trim()
            const password = document.getElementById('registerPassword').value
            const confirm = document.getElementById('registerConfirm').value
            const btn = document.getElementById('registerBtn')

            hideMessage()

            // التحقق من الحقول
            if (!name || !email || !password || !confirm) {
                showMessage('⚠️ يرجى ملء جميع الحقول', 'error')
                return
            }

            if (name.length < 2) {
                showMessage('⚠️ الاسم يجب أن يكون حرفين على الأقل', 'error')
                return
            }

            if (!email.includes('@') || !email.includes('.')) {
                showMessage('⚠️ يرجى إدخال بريد إلكتروني صحيح', 'error')
                return
            }

            if (password.length < 6) {
                showMessage('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error')
                return
            }

            if (password !== confirm) {
                showMessage('⚠️ كلمة المرور غير متطابقة', 'error')
                return
            }

            btn.disabled = true
            btn.innerHTML = '<i class="fas fa-spinner spinner"></i> جاري التسجيل...'

            try {
                // أولاً: التحقق من وجود البريد في جدول users
                const { data: existingUser, error: checkError } = await supabaseClient
                    .from('users')
                    .select('email')
                    .eq('email', email)
                    .maybeSingle()

                if (existingUser) {
                    showMessage('⚠️ هذا البريد الإلكتروني مسجل بالفعل. يرجى تسجيل الدخول', 'error')
                    btn.disabled = false
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'
                    setTimeout(() => {
                        switchTab('login')
                        document.getElementById('loginEmail').value = email
                    }, 1500)
                    return
                }

                // محاولة التسجيل في Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            role: 'user'
                        }
                    }
                })

                if (error) {
                    if (error.message.includes('User already registered')) {
                        showMessage('⚠️ هذا البريد الإلكتروني مسجل بالفعل. يرجى تسجيل الدخول', 'error')
                        setTimeout(() => {
                            switchTab('login')
                            document.getElementById('loginEmail').value = email
                        }, 1500)
                    } else {
                        showMessage('❌ ' + error.message, 'error')
                    }
                    btn.disabled = false
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'
                    return
                }

                // إذا نجح التسجيل، إضافة المستخدم إلى جدول users
                if (data.user) {
                    const { error: insertError } = await supabaseClient
                        .from('users')
                        .insert({
                            id: data.user.id,
                            email: email,
                            full_name: name,
                            role: 'user'
                        })

                    if (insertError) {
                        console.error('خطأ في إضافة المستخدم:', insertError)
                    }
                }

                showMessage('✅ تم التسجيل بنجاح! يمكنك الدخول الآن', 'success')

                // تفريغ الحقول
                document.getElementById('registerName').value = ''
                document.getElementById('registerEmail').value = ''
                document.getElementById('registerPassword').value = ''
                document.getElementById('registerConfirm').value = ''

                // التبديل إلى تسجيل الدخول مع تعبئة البريد
                setTimeout(() => {
                    switchTab('login')
                    document.getElementById('loginEmail').value = email
                    showMessage('✅ تم التسجيل بنجاح! أدخل كلمة المرور للدخول', 'success')
                }, 1000)

                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'

            } catch (error) {
                console.error('خطأ:', error)
                showMessage('❌ حدث خطأ غير متوقع: ' + error.message, 'error')
                btn.disabled = false
                btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء حساب'
            }
        }

        // ============================================================
        // دعم Enter key
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginForm = document.getElementById('loginForm')
                const registerForm = document.getElementById('registerForm')
                if (loginForm.classList.contains('active')) {
                    handleLogin()
                } else if (registerForm.classList.contains('active')) {
                    handleRegister()
                }
            }
        })

        // ============================================================
        // التحقق من الجلسة عند التحميل
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // تعبئة البريد الإلكتروني للمدمن
            document.getElementById('loginEmail').value = 'sajadsarmd200@gmail.com'
            
            // التحقق من وجود جلسة مخزنة
            const session = localStorage.getItem('devflix_session')
            if (session) {
                try {
                    const { data, error } = await supabaseClient.auth.setSession(JSON.parse(session))
                    if (!error && data.user) {
                        window.location.href = 'dashboard.html'
                        return
                    }
                } catch (e) {
                    console.log('جلسة منتهية')
                }
            }

            // التحقق من جلسة Supabase الحالية
            try {
                const { data: { user } } = await supabaseClient.auth.getUser()
                if (user) {
                    window.location.href = 'dashboard.html'
                }
            } catch (e) {
                console.log('لا توجد جلسة نشطة')
            }
        })
    </script>
</body>
</html>
