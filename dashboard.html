<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlix - الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           المتغيرات والتنسيقات العامة
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #1a1a1a;
            --bg-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #E50914;
            --accent-hover: #f6121e;
            --border-color: #2a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            --transition: all 0.3s ease;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* وضع النهار */
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        body.light-mode .sidebar {
            background: #ffffff;
        }

        body.light-mode .bottom-nav {
            background: #ffffff;
        }

        body.light-mode .search-bar input {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        body.light-mode .welcome-section {
            background: #ffffff;
        }

        body.light-mode .content-card {
            background: #ffffff;
        }

        /* ============================================================
           الهيدر
           ============================================================ */
        .dashboard-header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 65px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            cursor: pointer;
            font-size: 22px;
            color: var(--text-primary);
            display: none;
            padding: 5px;
        }

        .logo-small {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
        }

        .header-center {
            flex: 1;
            max-width: 500px;
            margin: 0 15px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            padding: 0 12px;
            transition: var(--transition);
        }

        .search-bar:focus-within {
            border-color: var(--accent);
        }

        .search-bar i {
            color: var(--text-muted);
        }

        .search-bar input {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
        }

        .search-btn:hover {
            background: var(--accent-hover);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            position: relative;
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 17px;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
        }

        .badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--accent);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 17px;
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .user-profile:hover {
            background: var(--bg-hover);
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }

        .user-profile span {
            font-size: 13px;
            font-weight: 600;
        }

        .user-profile .chevron {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 65px;
            right: 0;
            bottom: 0;
            width: 260px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            transform: translateX(100%);
            transition: var(--transition);
            z-index: 999;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-user {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .sidebar-user img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            margin-bottom: 8px;
        }

        .sidebar-user h3 {
            font-size: 17px;
            color: var(--text-primary);
        }

        .sidebar-user p {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 14px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-nav a.active {
            border-right: 3px solid var(--accent);
        }

        .sidebar-nav i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logout-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* ============================================================
           المحتوى الرئيسي
           ============================================================ */
        .main-content {
            margin-top: 65px;
            padding: 20px 20px 80px 20px;
            min-height: 100vh;
        }

        /* قسم الترحيب */
        .welcome-section {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-hover));
            border-radius: 20px;
            padding: 28px 30px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .welcome-text h1 {
            font-size: 26px;
            margin-bottom: 4px;
        }

        .welcome-text h1 span {
            color: var(--accent);
        }

        .welcome-text p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .welcome-stats {
            display: flex;
            gap: 25px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-primary);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .stat-item i {
            color: var(--accent);
            font-size: 18px;
        }

        .stat-item span {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-item label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* أقسام المحتوى */
        .content-section {
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header h2 {
            font-size: 19px;
            font-weight: 700;
        }

        .section-header a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-header a:hover {
            color: var(--accent);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 15px;
        }

        .content-card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .content-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.15);
        }

        .content-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .content-card .card-info {
            padding: 10px 12px;
        }

        .content-card .card-info h4 {
            font-size: 13px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .content-card .card-info .card-type {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ============================================================
           الشريط السفلي
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            height: 65px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 1000;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 10px;
            transition: var(--transition);
            position: relative;
        }

        .bottom-nav a i {
            font-size: 20px;
        }

        .bottom-nav a.active {
            color: var(--accent);
        }

        .bottom-nav a .badge {
            position: absolute;
            top: -2px;
            right: 4px;
            font-size: 8px;
            padding: 1px 5px;
            min-width: 15px;
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 18px;
            max-width: 450px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }

        .modal-header button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-header button:hover {
            color: var(--accent);
        }

        .modal-body {
            padding: 20px;
        }

        /* ============================================================
           الملف الشخصي في المودال
           ============================================================ */
        .profile-info {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            margin-bottom: 8px;
        }

        .profile-info h3 {
            font-size: 19px;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .profile-badge {
            display: inline-block;
            padding: 3px 14px;
            background: var(--bg-hover);
            border-radius: 20px;
            font-size: 12px;
            margin-top: 6px;
            color: var(--accent);
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            padding: 16px 0;
            text-align: center;
        }

        .profile-stats div span {
            display: block;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .profile-stats div {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .logout-btn.full {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .logout-btn.full:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
           الإشعارات
           ============================================================ */
        .notif-item {
            display: flex;
            gap: 14px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--bg-primary);
            border-right: 3px solid var(--accent);
        }

        .notif-item .notif-icon {
            font-size: 22px;
        }

        .notif-item .notif-text {
            flex: 1;
        }

        .notif-item .notif-text p {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .notif-item .notif-text span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .notif-item.read {
            opacity: 0.5;
            border-right-color: var(--text-muted);
        }

        .notif-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px 0;
        }

        .notif-empty i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        /* ============================================================
           تحريك
           ============================================================ */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           استجابة
           ============================================================ */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .header-center {
                margin: 0 8px;
            }

            .header-right .user-profile span,
            .header-right .user-profile .chevron {
                display: none;
            }

            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .welcome-stats {
                gap: 12px;
            }

            .stat-item {
                padding: 6px 14px;
            }

            .sidebar {
                width: 100%;
                transform: translateX(100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .welcome-text h1 {
                font-size: 22px;
            }

            .dashboard-header {
                padding: 0 12px;
                height: 58px;
            }

            .main-content {
                padding: 12px 12px 75px 12px;
                margin-top: 58px;
            }

            .bottom-nav {
                height: 58px;
            }

            .bottom-nav a i {
                font-size: 18px;
            }

            .bottom-nav a {
                font-size: 9px;
                padding: 3px 8px;
            }

            .search-bar input {
                font-size: 13px;
                padding: 6px 10px;
            }

            .search-btn {
                padding: 5px 10px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }

            .content-card img {
                height: 140px;
            }

            .content-card .card-info h4 {
                font-size: 12px;
            }

            .welcome-section {
                padding: 18px;
            }

            .welcome-text h1 {
                font-size: 19px;
            }

            .stat-item span {
                font-size: 15px;
            }

            .stat-item label {
                font-size: 10px;
            }

            .modal-content {
                max-width: 95%;
            }
        }

        /* ============================================================
           شاشة التحميل
           ============================================================ */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-secondary);
            gap: 12px;
        }

        .loading-spinner i {
            font-size: 28px;
            color: var(--accent);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    الهيدر
    ============================================================ -->
    <header class="dashboard-header">
        <div class="header-left">
            <div class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <div class="logo-small">🎬 DevFlix</div>
        </div>

        <div class="header-center">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عما يعجبك..." oninput="handleSearch()">
                <button class="search-btn" onclick="handleSearch()">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </div>

        <div class="header-right">
            <button class="icon-btn" onclick="toggleTheme()" title="تغيير الوضع">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button class="icon-btn" onclick="toggleNotifications()" title="الإشعارات">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge">0</span>
            </button>
            <div class="user-profile" onclick="toggleProfile()">
                <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=E50914&color=fff&size=40" alt="User">
                <span id="userNameDisplay">مستخدم</span>
                <i class="fas fa-chevron-down chevron"></i>
            </div>
        </div>
    </header>

    <!-- ============================================================
    القائمة الجانبية
    ============================================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-user">
            <img id="sidebarAvatar" src="https://ui-avatars.com/api/?name=User&background=E50914&color=fff&size=70" alt="User">
            <h3 id="sidebarUserName">مستخدم</h3>
            <p id="sidebarUserEmail">user@email.com</p>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="active" onclick="navigateTo('home')">
                <i class="fas fa-home"></i> الرئيسية
            </a>
            <a href="#" onclick="navigateTo('explore')">
                <i class="fas fa-compass"></i> استكشاف
            </a>
            <a href="#" onclick="navigateTo('watchlist')">
                <i class="fas fa-bookmark"></i> قائمة المشاهدة
            </a>
            <a href="#" onclick="navigateTo('history')">
                <i class="fas fa-clock"></i> سجل المشاهدة
            </a>
            <a href="#" onclick="navigateTo('downloads')">
                <i class="fas fa-download"></i> التحميلات
            </a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="handleLogout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </aside>

    <!-- ============================================================
    المحتوى الرئيسي
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <!-- قسم الترحيب -->
        <section class="welcome-section">
            <div class="welcome-text">
                <h1>مرحباً <span id="welcomeName">مستخدم</span> 👋</h1>
                <p>اكتشف أفضل الأفلام والمسلسلات التي تنتظرك</p>
            </div>
            <div class="welcome-stats">
                <div class="stat-item">
                    <i class="fas fa-film"></i>
                    <span id="moviesCount">0</span>
                    <label>فيلم</label>
                </div>
                <div class="stat-item">
                    <i class="fas fa-tv"></i>
                    <span id="seriesCount">0</span>
                    <label>مسلسل</label>
                </div>
                <div class="stat-item">
                    <i class="fas fa-play-circle"></i>
                    <span id="watchCount">0</span>
                    <label>مشاهدة</label>
                </div>
            </div>
        </section>

        <!-- حاوية المحتوى -->
        <div id="contentSections">
            <!-- سيتم ملؤها بواسطة JavaScript -->
        </div>

        <!-- شاشة التحميل -->
        <div id="loadingContent" class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <span>جاري التحميل...</span>
        </div>
    </main>

    <!-- ============================================================
    الشريط السفلي
    ============================================================ -->
    <nav class="bottom-nav">
        <a href="#" class="active" onclick="navigateTo('home')">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a href="#" onclick="navigateTo('search')">
            <i class="fas fa-search"></i>
            <span>بحث</span>
        </a>
        <a href="#" onclick="toggleNotifications()">
            <i class="fas fa-bell"></i>
            <span>الإشعارات</span>
            <span class="badge" id="bottomNotifBadge">0</span>
        </a>
        <a href="#" onclick="toggleProfile()">
            <i class="fas fa-user"></i>
            <span>ملفي الشخصي</span>
        </a>
    </nav>

    <!-- ============================================================
    مودال الإشعارات
    ============================================================ -->
    <div class="modal" id="notifModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-bell"></i> الإشعارات</h3>
                <button onclick="closeModal('notifModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="notifList">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </div>
    </div>

    <!-- ============================================================
    مودال الملف الشخصي
    ============================================================ -->
    <div class="modal" id="profileModal">
        <div class="modal-content profile-modal">
            <div class="modal-header">
                <h3><i class="fas fa-user"></i> ملفي الشخصي</h3>
                <button onclick="closeModal('profileModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="profile-info">
                    <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=E50914&color=fff&size=100" alt="User" class="profile-avatar">
                    <h3 id="profileName">مستخدم</h3>
                    <p id="profileEmail">user@email.com</p>
                    <span class="profile-badge" id="profileRole">👤 مستخدم</span>
                </div>
                <div class="profile-stats">
                    <div><span id="profileMovies">0</span> فيلم</div>
                    <div><span id="profileSeries">0</span> مسلسل</div>
                    <div><span id="profileWatched">0</span> مشاهدة</div>
                </div>
                <button onclick="handleLogout()" class="logout-btn full">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    الجافا سكريبت
    ============================================================ -->
    <script>
        // ============================================================
        // إعداد Supabase
        // ============================================================
        const supabaseUrl = 'https://hdtrnfpwyvaeziaiweck.supabase.co'
        const supabaseKey = 'sb_publishable_XYiUfizde8-Z0yBjvZNsBw_q_LSXK7V'
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

        // ============================================================
        // المتغيرات العامة
        // ============================================================
        let currentUser = null
        let allContent = []
        let filteredContent = []
        let notifications = []
        let isAdmin = false

        // ============================================================
        // دوال التحقق من الجلسة
        // ============================================================
        async function checkSession() {
            try {
                // التحقق من الجلسة المخزنة
                const session = localStorage.getItem('devflix_session')
                if (session) {
                    const { data, error } = await supabaseClient.auth.setSession(JSON.parse(session))
                    if (!error && data.user) {
                        currentUser = data.user
                        return true
                    }
                }

                // التحقق من الجلسة الحالية
                const { data: { user } } = await supabaseClient.auth.getUser()
                if (user) {
                    currentUser = user
                    return true
                }

                return false
            } catch (e) {
                return false
            }
        }

        // ============================================================
        // دوال تحميل البيانات
        // ============================================================
        async function loadUserData() {
            if (!currentUser) return

            try {
                // جلب بيانات المستخدم من جدول users
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('email', currentUser.email)
                    .single()

                if (data) {
                    isAdmin = data.role === 'admin'
                    currentUser.full_name = data.full_name || currentUser.user_metadata?.full_name || 'مستخدم'
                } else {
                    // إذا لم يكن في جدول users، استخدم metadata
                    currentUser.full_name = currentUser.user_metadata?.full_name || 'مستخدم'
                }

                // تحديث الواجهة
                updateUserUI()
            } catch (e) {
                console.error('خطأ في تحميل بيانات المستخدم:', e)
            }
        }

        async function loadContent() {
            try {
                const { data, error } = await supabaseClient
                    .from('content')
                    .select('*')
                    .order('created_at', { ascending: false })

                if (error) throw error

                allContent = data || []
                filteredContent = allContent
                renderContent()
                updateStats()
            } catch (e) {
                console.error('خطأ في تحميل المحتوى:', e)
            }
        }

        async function loadNotifications() {
            if (!currentUser) return

            try {
                const { data, error } = await supabaseClient
                    .from('notifications')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false })

                if (error) throw error

                notifications = data || []
                updateNotificationBadge()
            } catch (e) {
                console.error('خطأ في تحميل الإشعارات:', e)
            }
        }

        // ============================================================
        // دوال تحديث الواجهة
        // ============================================================
        function updateUserUI() {
            const name = currentUser?.full_name || 'مستخدم'
            const email = currentUser?.email || ''

            // تحديث جميع عناصر اسم المستخدم
            document.querySelectorAll('#userNameDisplay, #sidebarUserName, #welcomeName, #profileName').forEach(el => {
                el.textContent = name
            })

            document.querySelectorAll('#sidebarUserEmail, #profileEmail').forEach(el => {
                el.textContent = email
            })

            // تحديث الصور
            const avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=E50914&color=fff&size=100`
            document.querySelectorAll('#userAvatar, #sidebarAvatar, #profileAvatar').forEach(el => {
                el.src = avatarUrl
            })

            // تحديث دور المستخدم
            const roleEl = document.getElementById('profileRole')
            if (roleEl) {
                roleEl.textContent = isAdmin ? '👑 مدير' : '👤 مستخدم'
            }

            // إظهار زر الإدارة للمدمن
            if (isAdmin) {
                const nav = document.querySelector('.sidebar-nav')
                const adminLink = document.createElement('a')
                adminLink.href = '#'
                adminLink.onclick = () => navigateTo('admin')
                adminLink.innerHTML = '<i class="fas fa-cog"></i> لوحة التحكم'
                nav.appendChild(adminLink)
            }
        }

        function updateStats() {
            const films = allContent.filter(c => c.type === 'film').length
            const series = allContent.filter(c => c.type === 'series').length
            const cartoons = allContent.filter(c => c.type === 'cartoon').length

            document.getElementById('moviesCount').textContent = films + cartoons
            document.getElementById('seriesCount').textContent = series
            document.getElementById('watchCount').textContent = allContent.length

            // تحديث إحصائيات الملف الشخصي
            document.getElementById('profileMovies').textContent = films + cartoons
            document.getElementById('profileSeries').textContent = series
            document.getElementById('profileWatched').textContent = allContent.length
        }

        function updateNotificationBadge() {
            const unread = notifications.filter(n => !n.is_read).length
            document.querySelectorAll('#notifBadge, #bottomNotifBadge').forEach(el => {
                el.textContent = unread
                el.style.display = unread > 0 ? 'block' : 'none'
            })
        }

        // ============================================================
        // دوال عرض المحتوى
        // ============================================================
        function renderContent(filter = null) {
            const container = document.getElementById('contentSections')
            const loading = document.getElementById('loadingContent')

            let data = filter ? allContent.filter(c => c.type === filter) : allContent
            if (filteredContent.length > 0 && !filter) {
                data = filteredContent
            }

            // تصنيف المحتوى
            const films = data.filter(c => c.type === 'film')
            const series = data.filter(c => c.type === 'series')
            const cartoons = data.filter(c => c.type === 'cartoon')

            let html = ''

            // قسم الأفلام
            if (films.length > 0) {
                html += createSection('🎬 أفلام', 'film', films)
            }

            // قسم المسلسلات
            if (series.length > 0) {
                html += createSection('📺 مسلسلات', 'series', series)
            }

            // قسم الكرتون
            if (cartoons.length > 0) {
                html += createSection('🎨 كرتون', 'cartoon', cartoons)
            }

            if (!html) {
                html = `
                    <div style="text-align:center;padding:60px 20px;color:var(--text-secondary);">
                        <i class="fas fa-inbox" style="font-size:48px;margin-bottom:15px;display:block;color:var(--text-muted);"></i>
                        <h3 style="font-size:20px;color:var(--text-primary);">لا يوجد محتوى</h3>
                        <p>سيظهر هنا كل ما هو جديد</p>
                    </div>
                `
            }

            container.innerHTML = html
            loading.classList.add('hidden')
        }

        function createSection(title, type, items) {
            let cards = items.map(item => `
                <div class="content-card" onclick="playContent('${item.id}')">
                    <img src="${item.thumbnail_url || 'https://via.placeholder.com/300x200/1a1a1a/666?text=No+Image'}" 
                         alt="${item.title}"
                         onerror="this.src='https://via.placeholder.com/300x200/1a1a1a/666?text=No+Image'">
                    <div class="card-info">
                        <h4>${item.title}</h4>
                        <span class="card-type">
                            ${type === 'film' ? '🎬 فيلم' : type === 'series' ? '📺 مسلسل' : '🎨 كرتون'}
                        </span>
                    </div>
                </div>
            `).join('')

            return `
                <section class="content-section">
                    <div class="section-header">
                        <h2>${title}</h2>
                        <a href="#" onclick="filterByType('${type}')">عرض الجميع <i class="fas fa-arrow-left"></i></a>
                    </div>
                    <div class="content-grid">${cards}</div>
                </section>
            `
        }

        // ============================================================
        // دوال البحث والتصفية
        // ============================================================
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase()
            
            if (!query) {
                filteredContent = allContent
            } else {
                filteredContent = allContent.filter(item => 
                    item.title.toLowerCase().includes(query) ||
                    item.type.toLowerCase().includes(query)
                )
            }
            
            renderContent()
        }

        function filterByType(type) {
            document.getElementById('searchInput').value = ''
            filteredContent = allContent.filter(c => c.type === type)
            renderContent()
            
            // التمرير إلى الأعلى
            window.scrollTo({ top: 0, behavior: 'smooth' })
        }

        function showAll(type) {
            filterByType(type)
        }

        // ============================================================
        // دوال التنقل
        // ============================================================
        function navigateTo(page) {
            // تحديث الروابط النشطة
            document.querySelectorAll('.sidebar-nav a, .bottom-nav a').forEach(el => {
                el.classList.remove('active')
            })
            
            if (page === 'home') {
                filteredContent = allContent
                renderContent()
                document.querySelector('.sidebar-nav a:first-child')?.classList.add('active')
                document.querySelector('.bottom-nav a:first-child')?.classList.add('active')
            }
            
            // إغلاق القائمة الجانبية في الجوال
            closeSidebar()
        }

        // ============================================================
        // دوال تشغيل المحتوى
        // ============================================================
        function playContent(id) {
            const item = allContent.find(c => c.id === id)
            if (!item) return

            // هنا يمكن فتح صفحة تشغيل الفيديو
            alert(`🎬 تشغيل: ${item.title}\n\nنوع: ${item.type}\n\nهنا سيتم تشغيل الفيديو`)
            
            // في حالة وجود رابط فيديو
            if (item.video_url) {
                window.open(item.video_url, '_blank')
            }
        }

        // ============================================================
        // دوال الإشعارات
        // ============================================================
        function toggleNotifications() {
            const modal = document.getElementById('notifModal')
            modal.classList.toggle('show')
            
            if (modal.classList.contains('show')) {
                renderNotifications()
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notifList')
            
            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="notif-empty">
                        <i class="fas fa-bell-slash"></i>
                        <p>لا توجد إشعارات</p>
                    </div>
                `
                return
            }

            let html = notifications.map(n => `
                <div class="notif-item ${n.is_read ? 'read' : ''}" onclick="markNotificationRead('${n.id}')">
                    <div class="notif-icon">${n.type === 'new_content' ? '📢' : n.type === 'update' ? '✏️' : '🔔'}</div>
                    <div class="notif-text">
                        <p>${n.message}</p>
                        <span>${new Date(n.created_at).toLocaleString('ar-EG')}</span>
                    </div>
                </div>
            `).join('')

            container.innerHTML = html
        }

        async function markNotificationRead(id) {
            try {
                await supabaseClient
                    .from('notifications')
                    .update({ is_read: true })
                    .eq('id', id)
                
                notifications = notifications.map(n => 
                    n.id === id ? { ...n, is_read: true } : n
                )
                
                updateNotificationBadge()
                renderNotifications()
            } catch (e) {
                console.error('خطأ:', e)
            }
        }

        // ============================================================
        // دوال الملف الشخصي
        // ============================================================
        function toggleProfile() {
            const modal = document.getElementById('profileModal')
            modal.classList.toggle('show')
        }

        // ============================================================
        // دوال المودال
        // ============================================================
        function closeModal(id) {
            document.getElementById(id).classList.remove('show')
        }

        // إغلاق المودال عند النقر خارجه
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('show')
            }
        })

        // ============================================================
        // دوال القائمة الجانبية
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open')
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open')
        }

        // ============================================================
        // دوال الوضع الليلي
        // ============================================================
        function toggleTheme() {
            document.body.classList.toggle('light-mode')
            const icon = document.getElementById('themeIcon')
            icon.classList.toggle('fa-moon')
            icon.classList.toggle('fa-sun')
            
            localStorage.setItem('devflix_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark')
        }

        // ============================================================
        // دوال تسجيل الخروج
        // ============================================================
        async function handleLogout() {
            if (!confirm('هل أنت متأكد من رغبتك في تسجيل الخروج؟')) return

            try {
                await supabaseClient.auth.signOut()
                localStorage.removeItem('devflix_session')
                localStorage.removeItem('devflix_user')
                window.location.href = 'index.html'
            } catch (e) {
                console.error('خطأ:', e)
                alert('حدث خطأ أثناء تسجيل الخروج')
            }
        }

        // ============================================================
        // التهيئة
        // ============================================================
        async function init() {
            // التحقق من الجلسة
            const hasSession = await checkSession()
            if (!hasSession) {
                window.location.href = 'index.html'
                return
            }

            // تحميل بيانات المستخدم
            await loadUserData()
            
            // تحميل المحتوى
            await loadContent()
            
            // تحميل الإشعارات
            await loadNotifications()

            // استعادة الوضع
            const theme = localStorage.getItem('devflix_theme')
            if (theme === 'light') {
                document.body.classList.add('light-mode')
                document.getElementById('themeIcon').classList.remove('fa-moon')
                document.getElementById('themeIcon').classList.add('fa-sun')
            }
        }

        // بدء التطبيق
        document.addEventListener('DOMContentLoaded', init)
    </script>

</body>
</html>
